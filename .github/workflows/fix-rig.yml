name: Fix rig image asset

on:
  push:
    paths:
      - ".github/workflows/fix-rig.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract embedded rig image
        shell: python
        run: |
          import base64
          import re
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          m = re.search(r'data:image/webp;base64,([^"]+)', html)
          if not m:
              raise SystemExit("Embedded rig image not found")

          Path("rig.webp").write_bytes(base64.b64decode(m.group(1)))
          html = re.sub(r'data:image/webp;base64,[^"]+', 'rig.webp', html, count=1)
          p.write_text(html, encoding="utf-8")

      - name: Commit fixed asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rig.webp
          git commit -m "Fix rig image asset loading"
          git push
